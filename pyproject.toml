[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data-analysis-tool"
version = "0.1.0"
description = "A toolkit for statistical learning and data analysis"
dependencies = [
    "pandas",
    "numpy",
    "scipy"
]

[project.optional-dependencies]
plotting = [
    "plotly"
]
